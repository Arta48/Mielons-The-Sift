plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// GeckoLib Repository
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroup("com.geckolib")
			includeGroup("software.bernie.geckolib")
		}
	}

	// LambDynamicLights Repository
	maven {
		name = "Gegy"
		url = uri("https://maven.gegy.dev")
	}
}

loom {
    splitEnvironmentSourceSets()
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib
	implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// LambDynamicLights API (compileOnly, because mod is optional)
	compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynlights_version}+${project.minecraft_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand 'id': project.mod_id, 'version': project.version,
				'name': project.mod_name, 'description': project.mod_description,
				'author': project.mod_author, 'minecraft': project.minecraft_version,
				'java': project.java_version,
				'geckolib_version': project.geckolib_version, 'lambdynlights_version': project.lambdynlights_version

	}

	filesMatching("the_sift.mixins.json") {
		expand 'java': "JAVA_${project.java_version}"
	}
}

processClientResources {
	filesMatching("the_sift.client.mixins.json") {
		expand 'java': "JAVA_${project.java_version}"
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = targetCompatibility = project.java_version
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
